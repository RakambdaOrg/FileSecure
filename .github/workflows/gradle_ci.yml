name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-build.yml@main
    with:
      java-version: 26
      artifact-name: Gradle-Libs
      artifact-path: build/libs/filesecure-shaded.jar

  dropbox:
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/dropbox-publish-artifact.yml@main
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs:
      - build
    with:
      artifact-name: 'filesecure-shaded.jar'
      source: "filesecure-shaded.jar"
      target: "/Documents/JARs/FileSecure.jar"
      environment: DropboxPersonal
    secrets:
      dropbox-token: ${{ secrets.DROPBOX_TOKEN }}

  base-image:
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/docker-publish.yml@main
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs:
      - build
    with:
      runs-on: self-hosted
      docker-image: ${{ vars.DOCKER_IMAGE }}
      docker-auto-tag: false
      docker-extra-tag: base
      build-args: JAVA_VERSION=26
      docker-platforms: linux/amd64,linux/arm64
      environment: DockerSelfHosted
    secrets:
      docker-repo: ${{ secrets.DOCKER_REPO }}
      docker-username: ${{ secrets.DOCKER_USERNAME }}
      docker-token: ${{ secrets.DOCKER_TOKEN }}

  docker:
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-jib-publish.yml@main
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs:
      - base-image
    with:
      java-version: 26
      docker-image: ${{ vars.DOCKER_IMAGE }}
      docker-tag: latest
      environment: DockerSelfHosted
    secrets:
      docker-repo: ${{ secrets.DOCKER_REPO }}
      docker-username: ${{ secrets.DOCKER_USERNAME }}
      docker-token: ${{ secrets.DOCKER_TOKEN }}
      jib-extra-params: |
        -Djib.from.image=${{ secrets.DOCKER_REPO }}/${{ vars.DOCKER_IMAGE }}:base \
        -Djib.from.auth.username=${{ secrets.DOCKER_USERNAME }} \
        -Djib.from.auth.password=${{ secrets.DOCKER_TOKEN }}
